<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#030607" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/favicon.svg" />
		<link rel="manifest" href="/site.webmanifest" />

		<meta
			name="description"
			content="Show up. Lock in till sunrise. A synchronized room for our all-nighters: one countdown, one queue, everyone awake and building."
		/>
		<meta name="keywords" content="all-nighter, focus room, dev lock-in, synchronized study, late night coding, ethio jazz" />

		<!-- Open Graph / Facebook / Discord / Telegram -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="All Nighter" />
		<meta property="og:title" content="All Nighter · Show up. Lock in till sunrise." />
		<meta property="og:description" content="One synchronized room. One shared track queue. Everyone awake and building till dawn." />
		<meta property="og:image" content="/og-image.svg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="All Nighter — Show up. Lock in till sunrise." />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="All Nighter · Show up. Lock in till sunrise." />
		<meta name="twitter:description" content="One synchronized room. One shared track queue. Everyone awake and building till dawn." />
		<meta name="twitter:image" content="/og-image.svg" />
		<noscript>
			<style>
				[data-reveal],
				[data-hero],
				[data-split] {
					opacity: 1 !important;
					transform: none !important;
				}
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
