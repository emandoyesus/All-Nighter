<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="bg-cassette" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#240a33" />
			<stop offset="100%" stop-color="#0b0212" />
		</linearGradient>
		<linearGradient id="cassette-shell" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#a21caf" />
			<stop offset="100%" stop-color="#581c87" />
		</linearGradient>
	</defs>
	<circle cx="64" cy="64" r="64" fill="url(#bg-cassette)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.5" />
	<!-- Cassette shell -->
	<rect x="22" y="36" width="84" height="56" rx="5" fill="url(#cassette-shell)" stroke="#d946ef" stroke-width="1.5" />
	<!-- Label -->
	<rect x="28" y="42" width="72" height="34" rx="3" fill="#fff1f2" opacity="0.95" />
	<line x1="34" y1="48" x2="94" y2="48" stroke="#e11d48" stroke-width="1.8" />
	<!-- Tape window -->
	<rect x="36" y="54" width="56" height="18" rx="3" fill="#2e1065" stroke="#a21caf" stroke-width="1" />
	<!-- Spools -->
	<circle cx="48" cy="63" r="6" fill="#701a75" stroke="#f43f5e" stroke-width="1.5" />
	<circle cx="80" cy="63" r="6" fill="#701a75" stroke="#f43f5e" stroke-width="1.5" />
	<line x1="54" y1="63" x2="74" y2="63" stroke="#fb7185" stroke-width="1.5" opacity="0.85" />
	<!-- Trapezoid bottom -->
	<polygon points="34,92 40,82 88,82 94,92" fill="#4a044e" stroke="#c026d3" stroke-width="1.5" />
	<circle cx="46" cy="87" r="2" fill="#f43f5e" />
	<circle cx="82" cy="87" r="2" fill="#f43f5e" />
</svg>
