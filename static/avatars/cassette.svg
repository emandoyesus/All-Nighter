	<rect x="36" y="54" width="56" height="18" rx="3" fill="#091b1e" stroke="#17616d" stroke-width="1" />
	<!-- Spools -->
	<circle cx="48" cy="63" r="6" fill="#114d57" stroke="#83f9d6" stroke-width="1.5" />
	<circle cx="80" cy="63" r="6" fill="#114d57" stroke="#83f9d6" stroke-width="1.5" />
	<line x1="54" y1="63" x2="74" y2="63" stroke="#83f9d6" stroke-width="1.5" opacity="0.7" />
	<!-- Trapezoid bottom -->
	<polygon points="34,92 40,82 88,82 94,92" fill="#0d3b42" stroke="#17616d" stroke-width="1.5" />
	<circle cx="46" cy="87" r="2" fill="#83f9d6" />
	<circle cx="82" cy="87" r="2" fill="#83f9d6" />
</svg>
