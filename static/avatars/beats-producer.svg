<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="bg-beats" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#240c15" />
			<stop offset="100%" stop-color="#0b0206" />
		</linearGradient>
		<linearGradient id="jacket-beats" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#27272a" />
			<stop offset="100%" stop-color="#18181b" />
		</linearGradient>
		<linearGradient id="skin-beats" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#faebd7" />
			<stop offset="100%" stop-color="#decaba" />
		</linearGradient>
		<linearGradient id="cap-beats" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#e11d48" />
			<stop offset="100%" stop-color="#9f1239" />
		</linearGradient>
	</defs>

	<!-- Circular background -->
	<circle cx="64" cy="64" r="64" fill="url(#bg-beats)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.45" />

	<!-- Audio EQ sparkles in background -->
	<rect x="26" y="44" width="2" height="6" rx="1" fill="#fb7185" opacity="0.6" />
	<rect x="30" y="40" width="2" height="10" rx="1" fill="#fb7185" opacity="0.75" />
	<rect x="96" y="40" width="2" height="10" rx="1" fill="#fb7185" opacity="0.75" />
	<rect x="100" y="44" width="2" height="6" rx="1" fill="#fb7185" opacity="0.6" />

	<!-- Shoulders / Streetwear Bomber Jacket -->
	<path
		d="M22 116 C24 96 38 86 52 83 C54 86 58 90 64 90 C70 90 74 86 76 83 C90 86 104 96 106 116 C106 123 102 128 94 128 L34 128 C26 128 22 123 22 116 Z"
		fill="url(#jacket-beats)"
	/>
	<!-- Inner Shirt / Collar -->
	<path d="M52 83 Q64 96 76 83 Q64 102 52 83 Z" fill="#e11d48" />
	<path d="M56 86 L64 96 L72 86" stroke="#fecdd3" stroke-width="1.5" fill="none" />

	<!-- Neck -->
	<rect x="56" y="67" width="16" height="20" rx="3" fill="#decaba" />

	<!-- Head Base -->
	<ellipse cx="64" cy="54" rx="19" ry="23" fill="url(#skin-beats)" />

	<!-- Side Hair under cap -->
	<path d="M42 46 C42 54 44 60 46 64 C43 58 43 50 44 46 Z" fill="#18181b" />
	<path d="M86 46 C86 54 84 60 82 64 C85 58 85 50 84 46 Z" fill="#18181b" />

	<!-- Backward Baseball Cap (Sunset Ruby) -->
	<!-- Cap dome -->
	<path
		d="M40 38 C40 22 50 16 64 16 C78 16 88 22 88 38 Z"
		fill="url(#cap-beats)"
	/>
	<!-- Backward visor rim curved backward -->
	<ellipse cx="64" cy="22" rx="20" ry="7" fill="#881337" />
	<ellipse cx="64" cy="21" rx="18" ry="5.5" fill="#e11d48" />
	<!-- Snapback adjustment strap at front forehead -->
	<rect x="54" y="34" width="20" height="4" rx="2" fill="#4c0519" stroke="#fda4af" stroke-width="0.8" />
	<circle cx="60" cy="36" r="0.8" fill="#fda4af" />
	<circle cx="64" cy="36" r="0.8" fill="#fda4af" />
	<circle cx="68" cy="36" r="0.8" fill="#fda4af" />

	<!-- Fringe/hair peeking under cap -->
	<path d="M46 42 Q54 46 60 42 Q68 47 76 42 Q82 43 84 42 Q82 39 64 38 Q48 39 46 42 Z" fill="#18181b" />

	<!-- Studio Headphones around neck/ears (Warm Amber Bronze) -->
	<path
		d="M36 54 C35 32 46 22 64 22 C82 22 93 32 92 54"
		fill="none"
		stroke="#f59e0b"
		stroke-width="5"
		stroke-linecap="round"
	/>
	<!-- Left Earcup -->
	<rect x="31" y="46" width="10" height="22" rx="5" fill="#78350f" stroke="#fbbf24" stroke-width="1.8" />
	<rect x="33" y="50" width="6" height="14" rx="3" fill="#fbbf24" opacity="0.6" />

	<!-- Right Earcup -->
	<rect x="87" y="46" width="10" height="22" rx="5" fill="#78350f" stroke="#fbbf24" stroke-width="1.8" />
	<rect x="89" y="50" width="6" height="14" rx="3" fill="#fbbf24" opacity="0.6" />
</svg>
