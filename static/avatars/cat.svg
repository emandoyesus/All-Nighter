	<ellipse cx="76" cy="72" rx="6" ry="7" fill="#d946ef" />
	<ellipse cx="52" cy="71" rx="4.5" ry="5.5" fill="#f0abfc" />
	<ellipse cx="76" cy="71" rx="4.5" ry="5.5" fill="#f0abfc" />
