<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="bg-cat" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#1b0e2f" />
			<stop offset="100%" stop-color="#070211" />
		</linearGradient>
		<linearGradient id="cat-body" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#3b1766" />
			<stop offset="100%" stop-color="#1e0938" />
		</linearGradient>
	</defs>
	<circle cx="64" cy="64" r="64" fill="url(#bg-cat)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" />
	<!-- Cat Head & Ears -->
	<path
