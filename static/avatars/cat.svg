	<line x1="36" y1="80" x2="22" y2="76" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
	<line x1="36" y1="84" x2="20" y2="86" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
	<line x1="92" y1="80" x2="106" y2="76" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
	<line x1="92" y1="84" x2="108" y2="86" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
