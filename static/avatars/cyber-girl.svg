<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="avatar-bg-cybergirl" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0e1719" />
			<stop offset="100%" stop-color="#060c0d" />
		</linearGradient>
		<linearGradient id="jacket-cybergirl" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#144d56" />
			<stop offset="100%" stop-color="#0a2c32" />
		</linearGradient>
		<linearGradient id="skin-cybergirl" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#fdf4eb" />
			<stop offset="100%" stop-color="#e2cfbf" />
		</linearGradient>
		<linearGradient id="hair-cybergirl" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#19333a" />
			<stop offset="100%" stop-color="#0e1f23" />
		</linearGradient>
	</defs>

	<!-- Circular background -->
	<circle cx="64" cy="64" r="64" fill="url(#avatar-bg-cybergirl)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#17616d" stroke-width="1.5" stroke-opacity="0.6" />

	<!-- Floating neon stars in background -->
	<circle cx="30" cy="36" r="1.5" fill="#83f9d6" opacity="0.6" />
	<circle cx="98" cy="42" r="1.5" fill="#83f9d6" opacity="0.6" />

	<!-- Shoulders / Cyber Jacket with High Collar -->
	<path
		d="M22 115 C24 96 38 86 52 83 C54 86 58 90 64 90 C70 90 74 86 76 83 C90 86 104 96 106 115 C106 123 102 128 94 128 L34 128 C26 128 22 123 22 115 Z"
		fill="url(#jacket-cybergirl)"
	/>
	<path d="M52 83 L64 96 L76 83" stroke="#83f9d6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
	<line x1="64" y1="96" x2="64" y2="114" stroke="#83f9d6" stroke-width="2" stroke-linecap="round" opacity="0.8" />

	<!-- Neck -->
	<rect x="57" y="67" width="14" height="19" rx="3" fill="#e2cfbf" />

	<!-- Head Base -->
	<ellipse cx="64" cy="54" rx="17" ry="21" fill="url(#skin-cybergirl)" />

	<!-- Sleek Bob Haircut -->
	<path
		d="M42 46 C42 30 50 22 64 22 C78 22 86 30 86 46 C86 64 85 78 80 84 C76 80 80 64 80 50 C80 34 74 30 64 30 C54 30 48 34 48 50 C48 64 52 80 48 84 C43 78 42 64 42 46 Z"
		fill="url(#hair-cybergirl)"
	/>
	<!-- Bangs / Fringe -->
	<path
		d="M44 40 C48 30 54 26 64 26 C74 26 80 30 84 40 C78 36 71 36 65 38 C58 40 52 41 44 40 Z"
		fill="#11272d"
	/>
	<!-- Aqua Cyber Streak in Hair -->
	<path
		d="M52 35 C53 45 54 58 51 68"
		stroke="#83f9d6"
		stroke-width="2"
		stroke-linecap="round"
		fill="none"
		opacity="0.85"
	/>
	<path
		d="M78 38 C77 48 76 58 78 66"
		stroke="#83f9d6"
		stroke-width="1.5"
		stroke-linecap="round"
		fill="none"
		opacity="0.6"
	/>

	<!-- Crescent Moon Earring -->
	<path
		d="M82 66 C80 66 79 68 79 70 C79 72 81 74 83 74 C82 73 82 71 82 70 C82 68 83 67 84 66 C83 66 82 66 82 66 Z"
		fill="#83f9d6"
	/>
</svg>
