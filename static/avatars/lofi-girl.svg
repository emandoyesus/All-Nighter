	/>

	<!-- Earcups -->
	<rect x="37" y="44" width="9" height="20" rx="4.5" fill="#881337" stroke="#fb7185" stroke-width="1.8" />
	<rect x="39" y="48" width="5" height="12" rx="2.5" fill="#fda4af" opacity="0.6" />

	<rect x="82" y="44" width="9" height="20" rx="4.5" fill="#881337" stroke="#fb7185" stroke-width="1.8" />
	<rect x="84" y="48" width="5" height="12" rx="2.5" fill="#fda4af" opacity="0.6" />
