<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="avatar-bg-lofigirl" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#24131c" />
			<stop offset="100%" stop-color="#0d060a" />
		</linearGradient>
		<linearGradient id="hoodie-lofigirl" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#9f1239" />
			<stop offset="100%" stop-color="#4c0519" />
		</linearGradient>
		<linearGradient id="skin-lofigirl" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#faeee0" />
			<stop offset="100%" stop-color="#decaba" />
		</linearGradient>
		<linearGradient id="hair-lofigirl" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#3d2218" />
			<stop offset="100%" stop-color="#211009" />
		</linearGradient>
	</defs>

	<!-- Circular background -->
	<circle cx="64" cy="64" r="64" fill="url(#avatar-bg-lofigirl)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4" />

	<!-- Background Ponytail / Bun -->
	<circle cx="86" cy="40" r="14" fill="url(#hair-lofigirl)" />
	<path d="M82 32 C92 34 98 44 94 54 C90 48 86 44 82 42 Z" fill="#211009" />
	<!-- Scrunchie in Warm Amber Gold -->
	<circle cx="78" cy="44" r="5" fill="#f59e0b" opacity="0.95" />

