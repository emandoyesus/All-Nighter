	/>
	<circle cx="64" cy="98" r="2.5" fill="#fb7185" opacity="0.85" />

	<!-- Neck -->
	<path d="M57 68 L57 86 C60 88 68 88 71 86 L71 68 Z" fill="#decaba" />

	<!-- Head Base -->
	<ellipse cx="64" cy="54" rx="18" ry="22" fill="url(#skin-lofigirl)" />

