	<path
		d="M45 42 C48 33 54 28 64 28 C74 28 80 33 83 42 C79 38 72 37 66 40 C60 43 54 44 45 42 Z"
		fill="#27120a"
	/>
	<path
		d="M46 44 C48 54 50 64 47 70 C45 64 45 52 46 44 Z"
		fill="#27120a"
	/>
	<path
		d="M82 44 C80 54 78 64 81 70 C83 64 83 52 82 44 Z"
		fill="#27120a"
	/>

	<!-- Warm Rose Earring -->
	<circle cx="48" cy="62" r="2" fill="#fb7185" />

	<!-- Over-ear Studio Headphones (Sunset Rose) -->
	<path
		d="M42 50 C41 30 50 19 64 19 C78 19 87 30 86 50"
		fill="none"
		stroke="#fb7185"
		stroke-width="4.5"
