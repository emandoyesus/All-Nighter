	<path
		d="M44 48 C43 32 50 24 64 24 C78 24 85 32 84 48 C84 66 84 76 80 82 C74 78 78 64 78 52 C78 36 72 32 64 32 C54 32 50 38 50 52 C50 64 54 78 48 82 C44 76 44 66 44 48 Z"
