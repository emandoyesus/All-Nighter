<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="bg-nightdev" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#181326" />
			<stop offset="100%" stop-color="#07040d" />
		</linearGradient>
		<linearGradient id="hoodie-nightdev" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#3b1f5c" />
			<stop offset="100%" stop-color="#1e0c33" />
		</linearGradient>
		<linearGradient id="skin-nightdev" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#fdf2e9" />
			<stop offset="100%" stop-color="#decaba" />
		</linearGradient>
		<linearGradient id="beanie-nightdev" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#6366f1" />
			<stop offset="100%" stop-color="#3730a3" />
		</linearGradient>
	</defs>

	<!-- Circular background -->
	<circle cx="64" cy="64" r="64" fill="url(#bg-nightdev)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />

	<!-- Floating terminal prompt / code sparks -->
	<text x="24" y="38" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" opacity="0.6">&gt;_</text>
	<text x="96" y="42" fill="#818cf8" font-family="monospace" font-size="9" opacity="0.5">&#123;&#125;</text>

	<!-- Shoulders / Midnight Purple Hoodie -->
	<path
		d="M22 116 C24 96 38 86 52 83 C54 86 58 90 64 90 C70 90 74 86 76 83 C90 86 104 96 106 116 C106 123 102 128 94 128 L34 128 C26 128 22 123 22 116 Z"
		fill="url(#hoodie-nightdev)"
	/>
	<path d="M52 83 Q64 96 76 83 Q64 102 52 83 Z" fill="#1b082e" />

	<!-- Neck -->
	<rect x="56" y="67" width="16" height="20" rx="3" fill="#decaba" />

	<!-- Head Base -->
	<ellipse cx="64" cy="54" rx="19" ry="23" fill="url(#skin-nightdev)" />

	<!-- Side & Back Hair peeking under beanie -->
	<path d="M42 46 C42 54 44 60 46 64 C43 58 43 50 44 46 Z" fill="#1e1b2e" />
	<path d="M86 46 C86 54 84 60 82 64 C85 58 85 50 84 46 Z" fill="#1e1b2e" />

	<!-- Indigo Cuffed Beanie -->
	<path
		d="M40 38 C39 20 49 14 64 14 C79 14 89 20 88 38 Z"
		fill="url(#beanie-nightdev)"
	/>
	<!-- Beanie folded cuff -->
	<rect x="38" y="32" width="52" height="13" rx="4" fill="#4338ca" stroke="#6366f1" stroke-width="1.2" />
	<line x1="42" y1="38" x2="86" y2="38" stroke="#818cf8" stroke-width="1" opacity="0.6" />

	<!-- Bangs peeking under beanie -->
	<path d="M48 44 Q56 48 62 44 Q68 49 76 44 Q70 42 62 42 Q54 42 48 44 Z" fill="#1e1b2e" />

	<!-- Stylish Coder Glasses (Reflecting terminal screen green) -->
	<!-- Left Lens -->
	<rect x="44" y="49" width="16" height="13" rx="3.5" fill="#042f1a" fill-opacity="0.65" stroke="#34d399" stroke-width="1.8" />
	<!-- Left Lens Reflection -->
	<line x1="47" y1="53" x2="55" y2="53" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
	<line x1="47" y1="57" x2="52" y2="57" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

	<!-- Bridge -->
	<line x1="60" y1="54" x2="68" y2="54" stroke="#e0e7ff" stroke-width="1.8" />

	<!-- Right Lens -->
	<rect x="68" y="49" width="16" height="13" rx="3.5" fill="#042f1a" fill-opacity="0.65" stroke="#34d399" stroke-width="1.8" />
	<!-- Right Lens Reflection -->
	<line x1="71" y1="53" x2="79" y2="53" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
	<line x1="71" y1="57" x2="76" y2="57" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

	<!-- Glasses Temples -->
	<line x1="44" y1="53" x2="40" y2="51" stroke="#e0e7ff" stroke-width="1.5" />
	<line x1="84" y1="53" x2="88" y2="51" stroke="#e0e7ff" stroke-width="1.5" />
</svg>
