<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="bg-lofiboy" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0e1d16" />
			<stop offset="100%" stop-color="#040b08" />
		</linearGradient>
		<linearGradient id="hoodie-lofiboy" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#15803d" />
			<stop offset="100%" stop-color="#14532d" />
		</linearGradient>
		<linearGradient id="skin-lofiboy" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#faeee0" />
			<stop offset="100%" stop-color="#decaba" />
		</linearGradient>
		<linearGradient id="hair-lofiboy" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#2d1f19" />
			<stop offset="100%" stop-color="#180e0a" />
		</linearGradient>
	</defs>

	<!-- Circular background -->
	<circle cx="64" cy="64" r="64" fill="url(#bg-lofiboy)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4" />

	<!-- Shoulders / Cozy Forest Green Hoodie -->
	<path
		d="M22 116 C24 96 38 86 52 83 C54 86 58 90 64 90 C70 90 74 86 76 83 C90 86 104 96 106 116 C106 123 102 128 94 128 L34 128 C26 128 22 123 22 116 Z"
		fill="url(#hoodie-lofiboy)"
	/>

	<!-- Collar & Drawstrings -->
	<path d="M52 83 Q64 96 76 83 Q64 102 52 83 Z" fill="#0f3d22" />
	<path d="M60 92 L58 108" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
	<path d="M68 92 L70 108" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

	<!-- Neck -->
	<rect x="56" y="67" width="16" height="20" rx="3" fill="#decaba" />

	<!-- Head Base -->
	<ellipse cx="64" cy="54" rx="19" ry="23" fill="url(#skin-lofiboy)" />

	<!-- Hair (Messy Textured Wavy Boy Hair) -->
	<path
		d="M40 50 C38 32 46 22 64 22 C82 22 90 32 88 50 C88 44 82 36 64 36 C46 36 40 44 40 50 Z"
		fill="url(#hair-lofiboy)"
	/>
	<!-- Textured locks on top -->
	<path d="M42 38 Q50 20 64 20 Q78 20 86 38 Q80 28 64 28 Q48 28 42 38 Z" fill="#3d2a23" />
	<!-- Front Bangs / Messy Fringe -->
	<path
		d="M44 42 C48 34 56 30 64 30 C72 30 80 34 84 42 C79 36 73 37 68 43 C63 37 57 37 52 44 C48 40 46 41 44 42 Z"
		fill="#231712"
	/>
	<path d="M58 36 Q64 45 70 38 Q66 46 58 36 Z" fill="#231712" />

	<!-- Over-ear Studio Headphones (Warm Amber Gold) -->
	<path
		d="M38 52 C37 30 48 18 64 18 C80 18 91 30 90 52"
		fill="none"
		stroke="#f59e0b"
		stroke-width="5"
		stroke-linecap="round"
	/>
	<path
		d="M44 38 C48 27 55 23 64 23 C73 23 80 27 84 38"
		fill="none"
		stroke="#fbbf24"
		stroke-width="1.8"
		stroke-linecap="round"
		opacity="0.8"
	/>

	<!-- Left Earcup -->
	<rect x="33" y="44" width="10" height="22" rx="5" fill="#78350f" stroke="#f59e0b" stroke-width="1.8" />
	<rect x="35" y="48" width="6" height="14" rx="3" fill="#fbbf24" opacity="0.6" />

	<!-- Right Earcup -->
	<rect x="85" y="44" width="10" height="22" rx="5" fill="#78350f" stroke="#f59e0b" stroke-width="1.8" />
	<rect x="87" y="48" width="6" height="14" rx="3" fill="#fbbf24" opacity="0.6" />
</svg>
