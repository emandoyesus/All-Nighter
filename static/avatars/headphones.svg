<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="bg-hp" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#241407" />
			<stop offset="100%" stop-color="#0a0502" />
		</linearGradient>
		<linearGradient id="cup-orange" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#ea580c" />
			<stop offset="100%" stop-color="#9a3412" />
		</linearGradient>
	</defs>
	<circle cx="64" cy="64" r="64" fill="url(#bg-hp)" />
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5" />
	<!-- Headband -->
	<path
		d="M28 68 C28 36 42 22 64 22 C86 22 100 36 100 68"
		stroke="#44403c"
		stroke-width="7"
		stroke-linecap="round"
		fill="none"
	/>
	<path
		d="M34 52 C38 34 48 27 64 27 C80 27 90 34 94 52"
		stroke="#fb923c"
		stroke-width="2.5"
		stroke-linecap="round"
		fill="none"
		opacity="0.9"
	/>
	<!-- Ear cups left -->
	<rect x="20" y="60" width="16" height="34" rx="8" fill="url(#cup-orange)" stroke="#f97316" stroke-width="1.5" />
	<rect x="23" y="65" width="4" height="24" rx="2" fill="#fed7aa" opacity="0.9" />
	<!-- Ear cups right -->
	<rect x="92" y="60" width="16" height="34" rx="8" fill="url(#cup-orange)" stroke="#f97316" stroke-width="1.5" />
	<rect x="101" y="65" width="4" height="24" rx="2" fill="#fed7aa" opacity="0.9" />
	<!-- Soundwave inside (Radiating Amber Orange) -->
	<line x1="52" y1="72" x2="52" y2="84" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
	<line x1="60" y1="64" x2="60" y2="92" stroke="#fdba74" stroke-width="2.8" stroke-linecap="round" opacity="0.95" />
	<line x1="68" y1="68" x2="68" y2="88" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
	<line x1="76" y1="74" x2="76" y2="82" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
</svg>
