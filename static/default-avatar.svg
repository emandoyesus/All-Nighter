<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
	<defs>
		<linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0e1719" />
			<stop offset="100%" stop-color="#060c0d" />
		</linearGradient>
		<linearGradient id="avatar-hoodie" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#17616d" />
			<stop offset="100%" stop-color="#114d57" />
		</linearGradient>
		<linearGradient id="avatar-skin" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#f3ece1" />
			<stop offset="100%" stop-color="#d6cebf" />
		</linearGradient>
	</defs>

	<!-- Circular background -->
	<circle cx="64" cy="64" r="64" fill="url(#avatar-bg)" />

	<!-- Subtle inner rim -->
	<circle cx="64" cy="64" r="62.5" fill="none" stroke="#17616d" stroke-width="1.5" stroke-opacity="0.6" />

	<!-- Shoulders / Hoodie -->
	<path
		d="M20 114 C22 96 36 86 52 83 C54 86 58 92 64 92 C70 92 74 86 76 83 C92 86 106 96 108 114 C108 122 104 128 96 128 L32 128 C24 128 20 122 20 114 Z"
		fill="url(#avatar-hoodie)"
	/>

	<!-- Collar / Hoodie V-neck Accent -->
	<path
		d="M52 83 Q64 96 76 83 Q64 102 52 83 Z"
		fill="#0d3b42"
	/>
	<path
		d="M64 94 L64 108"
		stroke="#83f9d6"
		stroke-width="2"
		stroke-linecap="round"
		stroke-opacity="0.8"
	/>

	<!-- Neck -->
	<rect x="56" y="67" width="16" height="20" rx="4" fill="#d6cebf" />

	<!-- Head -->
	<ellipse cx="64" cy="54" rx="20" ry="24" fill="url(#avatar-skin)" />

	<!-- Hair / Beanie (Night owl style) -->
	<path
		d="M44 50 C44 32 50 26 64 26 C78 26 84 32 84 50 C84 44 80 37 64 37 C48 37 44 44 44 50 Z"
		fill="#0b2328"
	/>

	<!-- Over-ear Headphones headband -->
	<path
		d="M39 52 C38 31 48 20 64 20 C80 20 90 31 89 52"
		fill="none"
		stroke="#83f9d6"
		stroke-width="5"
		stroke-linecap="round"
	/>

	<!-- Headphone earcups -->
	<!-- Left earcup -->
	<rect x="34" y="44" width="10" height="22" rx="5" fill="#114d57" stroke="#83f9d6" stroke-width="2" />
	<rect x="36" y="48" width="6" height="14" rx="3" fill="#83f9d6" fill-opacity="0.4" />

	<!-- Right earcup -->
	<rect x="84" y="44" width="10" height="22" rx="5" fill="#114d57" stroke="#83f9d6" stroke-width="2" />
	<rect x="86" y="48" width="6" height="14" rx="3" fill="#83f9d6" fill-opacity="0.4" />
</svg>
